version: "3.8"
services:
  db:
    image: mysql:8.0
    container_name: homeservices-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homeservices
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./HomeServices-Backend1
    container_name: homeservices-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/homeservices?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8082:8081"   # backend at http://localhost:8082
    restart: unless-stopped

  frontend:
    build: ./HomeServices
    container_name: homeservices-frontend
    depends_on:
      - backend
    ports:
      - "3001:80"     # frontend at http://localhost:3001
    restart: unless-stopped

volumes:
  mysql_data: {}
